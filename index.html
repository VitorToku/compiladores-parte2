<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rabisko — Fase 2: da AST ao SVG</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px auto; padding: 0 16px; max-width: 1280px; }
    h1 { margin-top: 0; }
    .colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .colunas { grid-template-columns: 1fr; } }
    textarea { width: 100%; height: 260px; font-family: monospace; font-size: 15px; box-sizing: border-box; }
    button, select { margin: 10px 6px 10px 0; padding: 8px 14px; font-size: 15px; }
    table { border-collapse: collapse; font-family: monospace; font-size: 14px; }
    th, td { border: 1px solid #ccc; padding: 3px 10px; text-align: left; }
    th { background: #f0f0f0; }
    pre { border: 1px solid #ccc; padding: 10px; min-height: 40px; margin: 0; overflow: auto;
          white-space: pre-wrap; font-family: monospace; font-size: 13px; }
    .ok   { color: #0a6b2b; font-weight: bold; }
    .erro { color: #b00020; font-weight: bold; }
    #tokens { max-height: 240px; overflow: auto; }
    #saida { max-height: 360px; }
    #texto-svg { max-height: 300px; }
    #desenho { border: 1px solid #999; display: inline-block; line-height: 0; background: #fff;
               min-width: 40px; min-height: 40px; max-width: 100%; overflow: auto; }
    #desenho svg { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>Rabisko — compilador para SVG</h1>

  <div class="colunas">
    <div>
      <textarea id="entrada" spellcheck="false"></textarea>
      <br>
      <button id="botao">Analisar</button>
      <select id="exemplos"><option value="">— carregar um caso de teste —</option></select>

      <h3>Resultado</h3>
      <div id="status"></div>
      <pre id="saida"></pre>

      <h3>Tokens</h3>
      <div id="tokens"></div>
    </div>

    <div>
      <h3>Desenho</h3>
      <div id="desenho"></div>
      <br>
      <button id="baixar" disabled>Baixar .svg</button>

      <h3>SVG gerado</h3>
      <pre id="texto-svg"></pre>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
